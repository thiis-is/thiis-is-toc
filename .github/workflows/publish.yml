name: On legal docs change

on:
  push:
    branches:
      - master

permissions:
  contents: read

# The UI (thiis-is-ui) pulls this repo's content at build time (fetch-toc), so
# no dispatch to the UI is needed here. This workflow is the place for the
# future customer-notification hook.
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ── Placeholder: notify customers of material changes ──────────────────
      # TODO (thiis-is-toc#1): when meta.json "version" bumps materially, email
      # existing customers about the change (new effective date + links to the
      # updated docs). Depends on the email-deliverability work (thiis-is-ui#25).
      # Left as an intentional no-op hook for now.
      - name: Notify customers of TOC change (placeholder)
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('meta.json'))['version'])")
          echo "TODO thiis-is-toc#1 — notify customers. Current TOC version: $VERSION (no-op)"
